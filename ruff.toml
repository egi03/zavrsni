[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled per-file where needed
    "B008",  # do not perform function calls in default arguments (Django uses this)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "F401"]
"*/tests*.py" = ["B"]

[tool.ruff.lint.isort]
known-django = ["django"]
known-first-party = ["accounts", "music", "recommendations", "social", "spotify", "lastfm"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]

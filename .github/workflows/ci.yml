name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zavrsni

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-production"
          DEBUG: "True"
          SPOTIFY_CLIENT_ID: "dummy"
          SPOTIFY_CLIENT_SECRET: "dummy"
          LASTFM_API_KEY: "dummy"
        run: |
          coverage run manage.py test \
            recommendations.tests \
            lastfm.tests \
            spotify.tests \
            social.tests \
            music.tests
          coverage report --include="recommendations/*,lastfm/*,spotify/*,social/*,music/*,accounts/*"
          coverage xml --include="recommendations/*,lastfm/*,spotify/*,social/*,music/*,accounts/*"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: zavrsni/coverage.xml
